<!DOCTYPE html>
<html>
<head>
<title>🚀 Smart AI Dashboard V6</title>

<link rel="manifest" href="/static/manifest.json">

</head>
<body>

<h2>🚀 Smart AI Dashboard V6</h2>

<!-- ABA MELA TOOLS -->
<div id="tools">
  <button type="button" onclick="window.scrollTo(0,0)">🏠 Home</button>
  <button type="button" onclick="document.getElementById('input').focus()">💬 Chat</button>
  <button type="button" onclick="document.getElementById('mic').click()">🎤 Voice Input</button>
  <button type="button" onclick="readAloud()">📖 Read Aloud</button>
  <button type="button" onclick="toggleLanguage()">🌐 Language</button>
  <button type="button" onclick="document.getElementById('imagePicker').click()">🖼️ Image</button>
  <button type="button" onclick="toggleSettings()">⚙️ Settings</button>
</div>

<div id="settingsPanel" hidden>
  <p>⚙️ Aba Mela Settings</p>
  <label for="readText">Text to read aloud:</label>
  <input id="readText" placeholder="Type text to read..." />
  <input id="imagePicker" type="file" accept="image/*" hidden />
  <div id="imagePreview"></div>
</div>

<!-- END ABA MELA TOOLS -->

<input id="input" placeholder="Type or speak..." />
<button id="send">Send</button>
<button id="mic">🎤</button>
<div id="chat"></div>
<!-- ABA MELA APP MORE -->
<div id="appMore">
  <button type="button"
          onclick="toggleAppMore()"
          aria-expanded="false"
          aria-controls="appMoreMenu">
    ☰ App More
  </button>

  <div id="appMoreMenu" hidden>
    <button type="button" onclick="openAppPage('advertising')">📢 Advertising</button>
    <button type="button" onclick="openAppPage('search')">🔎 Search</button>
    <button type="button" onclick="openAppPage('social')">📣 Social Media Broadcast</button>
    <button type="button" onclick="openAppPage('tutorial')">📚 Tutorial</button>
    <button type="button" onclick="openAppPage('commodities')">🛒 Commodities</button>
    <button type="button" onclick="openAppPage('network')">📡 Telecommunications &amp; Network</button>
    <button type="button" onclick="openAppPage('coding')">💻 Coding Guideline</button>
    <button type="button" onclick="openAppPage('location')">📍 Location &amp; Mapping</button>
    <button type="button" onclick="openAppPage('email')">✉️ Email Address</button>
    <button type="button" onclick="openAppPage('users')">👥 Customers / Users</button>
    <button type="button" onclick="openAppPage('login')">🔐 Login</button>
    <button type="button" onclick="openAppPage('register')">📝 Register</button>
    <button type="button" onclick="openAppPage('logout')">🚪 Logout</button>
    <button type="button" onclick="closeAppMore()">↩️ Back</button>
  </div>
</div>
<!-- END ABA MELA APP MORE -->
<script>
let input = document.getElementById("input");
let sendBtn = document.getElementById("send");
let micBtn = document.getElementById("mic");
let chat = document.getElementById("chat");

// 🎤 VOICE INPUT
micBtn.onclick = () => {
  let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "am-ET";

  recognition.onresult = (event) => {
    input.value = event.results[0][0].transcript;
  };

  recognition.start();
};

// 🔊 VOICE OUTPUT
function speak(text) {
  let speech = new SpeechSynthesisUtterance(text);

  if (/[\u1200-\u137F]/.test(text)) {
    speech.lang = "am-ET";
  } else {
    speech.lang = "en-US";
  }

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}

// 💬 ADD MESSAGE
function addMessage(text) {
  let div = document.createElement("div");
  div.innerText = text;
  chat.appendChild(div);
}

// 📩 SEND
sendBtn.onclick = () => {
  let text = input.value;

  fetch("/api/ai", {
    method: "POST",
    body: JSON.stringify({message: text}),
    headers: {"Content-Type": "application/json"}
  })
  .then(res => res.json())
  .then(data => {
    addMessage("🤖 " + data.response);

    setTimeout(() => {
      speak(data.response);
    }, 200);
  });
};
</script>

<script>
function testVoice() {
    const speech = new SpeechSynthesisUtterance(
        "Hello Aba Mela Dashboard"
    );

    speech.lang = "en-US";
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}
</script>

</script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/service-worker.js");
}
</script>
<script>
function toggleSettings() {
    const panel = document.getElementById("settingsPanel");
    if (panel) {
        panel.hidden = !panel.hidden;
    }
}

function readAloud() {
    const field = document.getElementById("readText");
    const text = field ? field.value.trim() : "";

    if (!text) {
        const panel = document.getElementById("settingsPanel");
        if (panel) panel.hidden = false;
        if (field) field.focus();
        return;
    }

    speak(text);
}
</script>
<script>
function toggleAppMore() {
    const menu = document.getElementById("appMoreMenu");
    const button = document.querySelector(
        '#appMore button[aria-controls="appMoreMenu"]'
    );

    if (!menu || !button) return;

    menu.hidden = !menu.hidden;
    button.setAttribute("aria-expanded", String(!menu.hidden));
}

function closeAppMore() {
    const menu = document.getElementById("appMoreMenu");
    const button = document.querySelector(
        '#appMore button[aria-controls="appMoreMenu"]'
    );

    if (!menu || !button) return;

    menu.hidden = true;
    button.setAttribute("aria-expanded", "false");
}



function openAppPage(page) {
    if (page === "advertising") {
        const chat = document.getElementById("chat");

        if (!chat) {
            alert("Advertising could not open: chat area not found.");
            return;
        }

        chat.innerHTML = `
            <section id="advertisingPage">
                <h2>📢 Advertising</h2>
                <p>Welcome to AbaMelaAI Advertising.</p>
                <p>Advertising services will be added here.</p>
                <button type="button" onclick="closeAdvertising()">↩️ Back to Chat</button>
            </section>
        `;

        closeAppMore();
    }
}

function closeAdvertising() {
    const page = document.getElementById("advertisingPage");
    if (page) page.remove();
}
